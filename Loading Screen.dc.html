<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/nocturne-c8fc4b95-8463-43a3-b823-6161099ce854/styles.css">
  <script src="_ds/nocturne-c8fc4b95-8463-43a3-b823-6161099ce854/_ds_bundle.js"></script>
  <style>
    @keyframes dropV {
      0% { transform: translateY(-160px) rotate(-6deg); opacity: 0; }
      55% { transform: translateY(0) rotate(0deg); opacity: 1; }
      68% { transform: translateY(-10px); }
      78% { transform: translateY(0); }
      100% { transform: translateY(0); }
    }
    @keyframes dropH {
      0% { transform: translateX(-140px) rotate(8deg); opacity: 0; }
      55% { transform: translateX(0) rotate(0deg); opacity: 1; }
      68% { transform: translateX(6px); }
      78% { transform: translateX(0); }
      100% { transform: translateX(0); }
    }
    @keyframes impactRing {
      0%, 60% { opacity: 0; transform: scale(0.4); }
      68% { opacity: 0.55; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.6); }
    }
    @keyframes glowPulse {
      0%, 60% { opacity: 0; }
      75% { opacity: 0.9; }
      100% { opacity: 0.55; }
    }
    @keyframes fadeUp {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .nail-vertical { animation: dropV 1.5s cubic-bezier(.34,1.2,.64,1) 0.15s both; }
    .nail-horizontal { animation: dropH 1.5s cubic-bezier(.34,1.2,.64,1) 0.55s both; }
    .impact-ring { animation: impactRing 1.5s ease-out 0.55s both; }
    .mark-glow { animation: glowPulse 1.5s ease-out 0.55s both; }
    .brand-name { animation: fadeUp 0.7s ease-out 2.4s both; }
    .brand-tagline { animation: fadeUp 0.7s ease-out 2.6s both; }
    .brand-cta { animation: fadeUp 0.7s ease-out 2.8s both; }
    @keyframes verseInLTR {
      0% { transform: translateX(-70px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes verseInRTL {
      0% { transform: translateX(70px); opacity: 0; }
      100% { transform: translateX(0); opacity: 1; }
    }
    @keyframes lightBloom {
      0%, 40% { opacity: 0; transform: scale(0.5); }
      70% { opacity: 1; transform: scale(1); }
      100% { opacity: 0.85; transform: scale(1); }
    }
    @keyframes raysFade { 0% { opacity: 0; } 100% { opacity: 1; } }
    @keyframes raysSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .rays-bg { animation: raysFade 2.2s ease-out both; }
    .rays-spin { animation: raysSpin 90s linear infinite; }
    .verse-en { animation: verseInLTR 1.1s cubic-bezier(.22,.9,.3,1) 0.3s both; }
    .verse-gr { animation: verseInRTL 1.1s cubic-bezier(.22,.9,.3,1) 3.2s both; }
    .divine-light { animation: lightBloom 1.8s ease-out 0.4s both; }
    @keyframes dripGrow {
      0%, 100% { transform: scaleY(1); }
      0% { transform: scaleY(0); opacity: 0; }
      15% { opacity: 1; }
      60% { transform: scaleY(1); opacity: 1; }
      100% { transform: scaleY(1); opacity: 0.9; }
    }
    @keyframes dropFall {
      0%, 55% { opacity: 0; transform: translateY(0); }
      65% { opacity: 1; transform: translateY(2px); }
      100% { opacity: 1; transform: translateY(10px); }
    }
    .blood-drip { transform-origin: top center; animation: dripGrow 1.4s cubic-bezier(.4,0,.2,1) both; }
    .blood-drop { animation: dropFall 1.4s ease-in both; }
    @keyframes holeFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
    .nail-hole { animation: holeFadeIn 0.4s ease-out both; }
    @keyframes crownFadeIn { 0% { opacity: 0; transform: translateX(-50%) translateY(-6px); } 100% { opacity: 1; transform: translateX(-50%) translateY(0); } }
    @keyframes haloPulse { 0%, 100% { opacity: 0.85; } 50% { opacity: 1; } }
    .halo { animation: crownFadeIn 0.7s ease-out both, haloPulse 3s ease-in-out 2.5s infinite; }
    .crown { animation: crownFadeIn 0.6s ease-out both; }
    @keyframes figureFadeIn { 0% { opacity: 0; transform: translateX(-50%) translateY(6px); } 100% { opacity: 1; transform: translateX(-50%) translateY(0); } }
    .figure { animation: figureFadeIn 0.7s ease-out both; }
    @keyframes karaokeSweep { 0% { background-position: 100% 0; } 100% { background-position: 0 0; } }
    .karaoke {
      background-image: linear-gradient(90deg, var(--color-accent) 50%, var(--color-neutral-400) 50%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: karaokeSweep linear both;
    }
  </style>
</helmet>
<div style="width:100%;min-height:100vh;background:radial-gradient(ellipse 80% 60% at 50% 30%, var(--color-neutral-800), var(--color-bg) 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-5);font-family:var(--font-body);overflow-x:hidden;position:relative;padding:var(--space-8) var(--space-6)">

  <div class="rays-bg" style="position:absolute;inset:0;z-index:0;pointer-events:none">
    <div class="rays-spin" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:1400px;height:1400px;background:repeating-conic-gradient(from 0deg, color-mix(in oklch, var(--color-accent) 26%, #f4d99a 45%) 0deg 4deg, transparent 4deg 16deg);opacity:0.35;mix-blend-mode:screen"></div>
    <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:640px;height:640px;border-radius:50%;background:radial-gradient(circle, color-mix(in oklch, #f4d99a 55%, var(--color-accent) 25%) 0%, transparent 70%);opacity:0.5"></div>
  </div>

  <p class="verse-en karaoke" style="position:relative;z-index:1;max-width:520px;text-align:center;font-family:var(--font-heading);font-weight:500;font-size:17px;line-height:1.5;margin:0 0 var(--space-4);animation:verseInLTR 1.1s cubic-bezier(.22,.9,.3,1) 0.3s both, karaokeSweep 2.2s linear 1.4s both">"I am the way and the truth and the life; no one comes to the Father except through me."</p>

  <div style="position:relative;width:220px;height:300px;display:flex;align-items:center;justify-content:center">
    <div class="divine-light" style="position:absolute;width:440px;height:440px;border-radius:50%;background:radial-gradient(circle, color-mix(in oklch, var(--color-accent) 55%, white 15%) 0%, color-mix(in oklch, var(--color-accent) 30%, transparent) 35%, transparent 65%);filter:blur(6px);z-index:0"></div>

    <div class="halo" style="position:absolute;left:50%;top:8px;transform:translateX(-50%);width:130px;height:46px;z-index:6;animation-delay:1.8s">
      <div style="position:absolute;inset:0;border-radius:50%;background:radial-gradient(ellipse at center, transparent 52%, #f4d99a 58%, #e8c46e 64%, transparent 74%);box-shadow:0 0 34px 10px rgba(244,217,154,0.6), 0 0 64px 20px rgba(244,217,154,0.3)"></div>
    </div>

    <div style="position:absolute;width:26px;height:200px;left:50%;top:70px;transform:translateX(-50%);z-index:2">
      <div class="nail-vertical" style="width:100%;height:100%;border-radius:3px;background:linear-gradient(90deg, var(--color-neutral-500), var(--color-neutral-200) 45%, var(--color-neutral-400));box-shadow:var(--shadow-md)"></div>
    </div>

    <div style="position:absolute;width:170px;height:24px;left:50%;top:110px;transform:translateX(-50%);z-index:3">
      <div class="nail-horizontal" style="width:100%;height:100%;border-radius:3px;background:linear-gradient(180deg, var(--color-neutral-500), var(--color-neutral-200) 45%, var(--color-neutral-400));box-shadow:var(--shadow-md)"></div>
    </div>

    <div class="nail-hole" style="position:absolute;left:50%;bottom:26px;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 35%, var(--color-neutral-900), #000 75%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);z-index:6;animation-delay:1.45s"></div>
    <div class="blood-drip" style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:5px;height:26px;border-radius:0 0 4px 4px;background:linear-gradient(180deg, #7a1620, #4a0d13);z-index:6;animation-delay:1.55s"></div>
    <div class="blood-drop" style="position:absolute;left:50%;bottom:-10px;transform:translateX(-50%);width:6px;height:8px;border-radius:50% 50% 50% 0;background:#5c1017;z-index:6;animation-delay:1.85s"></div>

    <div class="nail-hole" style="position:absolute;left:calc(50% - 85px);top:122px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%, var(--color-neutral-900), #000 75%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);z-index:6;animation-delay:1.05s"></div>
    <div class="blood-drip" style="position:absolute;left:calc(50% - 85px);top:134px;width:5px;height:22px;border-radius:0 0 4px 4px;background:linear-gradient(180deg, #7a1620, #4a0d13);z-index:6;animation-delay:1.15s"></div>
    <div class="blood-drop" style="position:absolute;left:calc(50% - 85px);top:158px;width:6px;height:8px;border-radius:50% 50% 50% 0;background:#5c1017;z-index:6;animation-delay:1.45s"></div>

    <div class="nail-hole" style="position:absolute;left:calc(50% + 72px);top:122px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 35%, var(--color-neutral-900), #000 75%);box-shadow:inset 0 1px 2px rgba(0,0,0,.8);z-index:6;animation-delay:1.05s"></div>
    <div class="blood-drip" style="position:absolute;left:calc(50% + 72px);top:134px;width:5px;height:22px;border-radius:0 0 4px 4px;background:linear-gradient(180deg, #7a1620, #4a0d13);z-index:6;animation-delay:1.15s"></div>
    <div class="blood-drop" style="position:absolute;left:calc(50% + 72px);top:158px;width:6px;height:8px;border-radius:50% 50% 50% 0;background:#5c1017;z-index:6;animation-delay:1.45s"></div>
  </div>

  <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--space-2)">
    <div class="brand-name" style="font-family:var(--font-heading);font-weight:500;font-size:28px;color:var(--color-text);letter-spacing:0.01em">{{ appName }}</div>
    <div class="brand-tagline" style="font-size:14px;color:var(--color-neutral-300)">Walk closer, one pursuit at a time</div>
  </div>

  <div class="brand-cta" style="position:relative;z-index:1;margin-top:var(--space-4)">
    <button class="btn btn-primary" style="white-space:nowrap;min-width:180px" onClick="{{ onContinue }}">Get Started</button>
  </div>

  <p class="verse-gr karaoke" style="position:relative;z-index:1;max-width:520px;text-align:center;font-family:var(--font-body);font-size:15px;line-height:1.6;margin:var(--space-4) 0 0;animation:verseInRTL 1.1s cubic-bezier(.22,.9,.3,1) 3.2s both, karaokeSweep 2.4s linear 4.3s both">Ἐγώ εἰμι ἡ ὁδὸς καὶ ἡ ἀλήθεια καὶ ἡ ζωή· οὐδεὶς ἔρχεται πρὸς τὸν πατέρα εἰ μὴ δι᾽ ἐμοῦ.</p>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    return {
      appName: 'The Gospel Pursuit',
      onContinue: () => console.log('continue tapped')
    };
  }
}
</script>
</body>
</html>
